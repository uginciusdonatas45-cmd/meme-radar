<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meme Radar</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb}
main{max-width:760px;margin:auto;padding:20px 16px 40px}
h1{margin:8px 0 4px;font-size:30px}.sub{color:#9ca3af;margin-bottom:22px}
.card{background:#131720;border:1px solid #252b38;border-radius:18px;padding:16px;margin:12px 0}
label{display:block;color:#aeb5c2;font-size:14px;margin-bottom:8px}
input,button{width:100%;border-radius:12px;border:1px solid #303746;background:#0e1219;color:#fff;padding:14px;font-size:16px}
button{margin-top:10px;background:#fff;color:#090b10;font-weight:700;border:0}
.result{display:none}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #252b38}
.row:last-child{border-bottom:0}.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:700;font-size:13px}
.high{background:#4a1e25;color:#ff9aa7}.med{background:#4a3919;color:#ffd27a}.low{background:#173b28;color:#8ef0b1}
.flags{margin:12px 0 0;padding-left:20px;color:#d4d9e2}.muted{color:#8f98a8;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>🚨 Meme Radar</h1>
<div class="sub">Solana meme coin rizikos patikra</div>

<div class="card">
<label for="mint">Token mint / CA</label>
<input id="mint" placeholder="Įklijuok Solana token mint adresą" autocomplete="off">
<button id="scan">🔎 Scan token</button>
<div id="status" class="muted" style="margin-top:10px"></div>
</div>

<div id="result" class="card result">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 style="margin:0">Risk</h2><span id="badge" class="badge"></span>
</div>
<div id="rows"></div>
<h3>⚠️ Flags</h3>
<ul id="flags" class="flags"></ul>
<p class="muted">Ši MVP versija vertina tik tokenų accountų koncentraciją. Ji nėra investavimo rekomendacija ir nepatvirtina, kad tokenas yra saugus.</p>
</div>
</main>

<script>
const RPC="https://api.mainnet-beta.solana.com";
const $=id=>document.getElementById(id);

async function rpc(method,params){
  const r=await fetch(RPC,{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})
  });
  const j=await r.json();
  if(j.error) throw new Error(j.error.message);
  return j.result;
}

function pct(x){return (x*100).toFixed(2)+"%"}

async function scan(){
  const mint=$("mint").value.trim();
  $("status").textContent="Tikrinama…";
  $("result").style.display="none";

  if(!mint){
    $("status").textContent="Įvesk Solana token mint adresą.";
    return;
  }

  try{
    const supply=await rpc("getTokenSupply",[mint,{commitment:"confirmed"}]);
    const largest=await rpc("getTokenLargestAccounts",[mint,{commitment:"confirmed"}]);

    const total=Number(supply.value.uiAmount||0);
    const vals=(largest.value||[]).map(x=>Number(x.uiAmount||0));
    const top1=vals[0]||0;
    const topAll=vals.reduce((a,b)=>a+b,0);
    const top1p=total?top1/total:0;
    const topAllp=total?topAll/total:0;

    let risk="LOW", cls="low", flags=[];

    if(top1p>.50 || topAllp>.85){risk="HIGH";cls="high"}
    else if(top1p>.20 || topAllp>.65){risk="MEDIUM";cls="med"}

    if(top1p>.50) flags.push("Vienas didžiausių accountų turi daugiau nei 50% supply.");
    else if(top1p>.20) flags.push("Vienas didžiausių accountų turi daugiau nei 20% supply.");

    if(topAllp>.85) flags.push("Top token accounts koncentracija viršija 85%.");
    else if(topAllp>.65) flags.push("Top token accounts koncentracija viršija 65%.");

    if(!flags.length) flags.push("Ryški supply koncentracijos rizika šiame teste nenustatyta.");

    $("badge").textContent=risk;
    $("badge").className="badge "+cls;

    $("rows").innerHTML=
      '<div class="row"><span>Supply</span><b>'+Number(total).toLocaleString()+"</b></div>"+
      '<div class="row"><span>Top 1 account</span><b>'+pct(top1p)+"</b></div>"+
      '<div class="row"><span>Top accounts</span><b>'+pct(topAllp)+"</b></div>"+
      '<div class="row"><span>Mint</span><b style="font-size:12px;word-break:break-all">'+mint+"</b></div>";

    $("flags").innerHTML=flags.map(x=>"<li>"+x+"</li>").join("");
    $("result").style.display="block";
    $("status").textContent="Baigta.";
  }catch(e){
    $("status").textContent="Klaida: "+e.message+". Patikrink Solana mint adresą.";
  }
}

$("scan").onclick=scan;
$("mint").addEventListener("keydown",e=>{if(e.key==="Enter")scan()});
</script>
</body>
</html>
